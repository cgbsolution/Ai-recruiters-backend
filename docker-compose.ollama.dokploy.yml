# Ollama — the Talent Agent's self-hosted AI (embeddings + match scoring, CV
# parsing and agent interviews) — Dokploy deployment. No Anthropic credits used.
#
# Deploy as: Create Service → Compose → Provider "Raw" → paste this file.
# Compose Type: "Docker Compose" (container_name is needed for the fixed DNS name).
#
# Afterwards, set on the Backend-api service (the Talent Agent worker runs inside it):
#   EMBEDDING_PROVIDER=ollama
#   OLLAMA_BASE_URL=http://ollama:11434
# (TALENT_LLM_PROVIDER=ollama and TALENT_OLLAMA_MODEL=qwen2.5:7b-instruct are the
# defaults.) Then Talent Agent → Matching readiness → "Embed profiles" (one-time backfill).
#
# Sizing: bge-m3 needs ~1.5 GB RAM, qwen2.5:7b-instruct ~5.5 GB (with its
# context), so the server needs ~8 GB free for this container (OLLAMA_MEM,
# default 10g) and ~6 GB of disk. Both are CPU-heavy, so the container is capped
# (OLLAMA_CPUS, default 2) to keep live interviews responsive. For scale, on a
# 4-core laptop CPU: embedding ~2.4 profiles/s (40,000 in ~5 h, then only new or
# changed CVs); scoring one candidate for a job ~1-2 min, so a job's top 20
# (TALENT_OLLAMA_RERANK_POOL) take ~35-40 min in the background. More cores
# (OLLAMA_CPUS) make scoring faster; a GPU makes it much faster.
# Faster but flatter scores: OLLAMA_CHAT_MODEL=qwen2.5:3b-instruct here AND
# TALENT_OLLAMA_MODEL=qwen2.5:3b-instruct on the Backend-api.
#
# Local dev uses the Ollama desktop app instead (OLLAMA_BASE_URL defaults to
# http://localhost:11434; run `ollama pull bge-m3` and
# `ollama pull qwen2.5:7b-instruct` once).

services:
  ollama:
    image: ollama/ollama:latest
    # Fixed name so other Dokploy services can reach it as http://ollama:11434.
    container_name: ollama
    restart: unless-stopped
    cpus: "${OLLAMA_CPUS:-2}"
    mem_limit: "${OLLAMA_MEM:-10g}"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      # The embedding model and the chat model stay loaded side by side.
      - OLLAMA_MAX_LOADED_MODELS=2
      # One request at a time: on a CPU, parallel requests only share the same cores.
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      # Downloaded models live here — survives redeploys.
      - ollama_data:/root/.ollama
    # No `ports:` — reachable only inside dokploy-network.
    # Never expose 11434 publicly: Ollama has no authentication.
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot model downloads (embeddings + the chat model). Runs on every
  # deploy; a model already in the ollama_data volume is only verified.
  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - dokploy-network
    environment:
      - CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for model in bge-m3 "$$CHAT_MODEL"; do
          echo ">> pulling $$model"
          curl -sS --fail -X POST http://ollama:11434/api/pull \
            -H "content-type: application/json" -d "{\"model\":\"$$model\",\"stream\":false}"
          echo
        done
        echo "✅ ollama-init done"

volumes:
  ollama_data:

networks:
  dokploy-network:
    external: true
