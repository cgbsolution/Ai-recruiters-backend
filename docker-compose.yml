version: "3.9"

services:
  backend:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    volumes:
      # Persistent volume — survives redeployments and container restarts.
      # All uploads (resumes, recordings, photos, screenshots) are stored here.
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
    driver: local
